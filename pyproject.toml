[project]
name = "metro-router"
version = "0.1.0"
description = "CLI route planner for the São Paulo metro, built on data structures and algorithms implemented from scratch."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Miguelbbezerra", email = "carlosmiguelcm820@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []
keywords = ["algorithms", "data-structures", "dijkstra", "graphs", "cli"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Typing :: Typed",
]

[project.scripts]
metro = "metro_router.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.11",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "PL",  # pylint
    "RUF", # ruff-specific
]
ignore = ["PLR2004"] # magic values are fine in tests and small algorithms

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests", "benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.coverage.run]
source = ["metro_router"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
